[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hn-tree"
version = "0.1.0"
description = "Render Hacker News stories and their comment threads as text trees."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
    # Without sniffio, httpcore retries a failed `import sniffio` for every lock it
    # creates, which roughly doubled CPU time on a 400-comment thread.
    "sniffio>=1.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
hn-tree = "hn_tree.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hn_tree"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Box-drawing characters (│ ├ └) are the whole point of this tool.
ignore = ["RUF001", "RUF003"]

[tool.mypy]
strict = true
files = ["src"]
